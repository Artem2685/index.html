<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Расчет рамки (любая форма)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 10px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 1.3em; text-align: center; color: #2c3e50; margin-top: 0; margin-bottom: 10px; }
        .canvas-wrapper { position: relative; width: 100%; border: 2px dashed #bdc3c7; border-radius: 10px; overflow: hidden; background: #ecf0f1; margin-bottom: 15px; touch-action: none; }
        canvas { display: block; width: 100%; height: auto; cursor: crosshair; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        button { padding: 12px; border: none; border-radius: 8px; font-size: 0.95em; font-weight: bold; cursor: pointer; }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:active { background-color: #2980b9; }
        .btn-danger { background-color: #e74c3c; color: white; }
        .btn-danger:active { background-color: #c0392b; }
        .btn-secondary { background-color: #95a5a6; color: white; }
        .results { background: #e8f6f3; border-radius: 10px; padding: 10px; font-size: 0.9em; max-height: 200px; overflow-y: auto; }
        .result-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #d1f2eb; }
        .result-item:last-child { border-bottom: none; }
        .result-label { font-weight: 500; }
        .result-value { font-weight: bold; color: #16a085; }
        .hint { font-size: 0.8em; color: #7f8c8d; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📐 Рамка для нестандартного стекла</h1>
        <p class="hint">Нажимайте на холст, чтобы расставить вершины стекла. Затем нажмите «Замкнуть».</p>
        
        <div class="canvas-wrapper">
            <canvas id="canvas" width="600" height="400"></canvas>
        </div>

        <div class="controls">
            <button class="btn-secondary" onclick="undoPoint()">↩️ Отменить точку</button>
            <button class="btn-primary" onclick="closePolygon()">✅ Замкнуть</button>
            <button class="btn-danger" onclick="clearAll()">🗑️ Очистить</button>
            <button class="btn-primary" onclick="calculate()">📏 Рассчитать рамку</button>
        </div>

        <div class="results" id="results">
            <div class="result-item"><span class="result-label">Нарисуйте форму стекла</span></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const offsetMM = 11; // Смещение внутрь с каждой стороны в мм
        const pxPerMM = 1;   // Масштаб: 1 пиксель = 1 мм (приблизительно для экрана)
        
        let points = [];      // Координаты вершин стекла (в пикселях)
        let closed = false;   // Замкнут ли контур
        let offsetPoints = []; // Координаты вершин рамки

        // Инициализация холста (адаптация под размер экрана)
        function resizeCanvas() {
            const wrapper = canvas.parentElement;
            const rect = wrapper.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.width * 0.7; // Соотношение сторон
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        // Обработка нажатий на холст
        canvas.addEventListener('mousedown', (e) => {
            if (closed) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            points.push({ x, y });
            draw();
        });

        // Обработка касаний (для телефона)
        canvas.addEventListener('touchstart', (e) => {
            if (closed) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            points.push({ x, y });
            draw();
        }, { passive: false });

        // Отрисовка всего
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Рисуем сетку (для наглядности)
            drawGrid();

            // Рисуем контур стекла
            if (points.length > 0) {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                if (closed) {
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(52, 152, 219, 0.1)';
                    ctx.fill();
                }
                ctx.strokeStyle = '#3498db';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Рисуем точки
                points.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#2980b9';
                    ctx.fill();
                });
            }

            // Если контур замкнут, рисуем рамку
            if (closed && offsetPoints.length > 0) {
                ctx.beginPath();
                ctx.moveTo(offsetPoints[0].x, offsetPoints[0].y);
                for (let i = 1; i < offsetPoints.length; i++) {
                    ctx.lineTo(offsetPoints[i].x, offsetPoints[i].y);
                }
                ctx.closePath();
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]); // Пунктирная линия для рамки
                ctx.stroke();
                ctx.setLineDash([]); // Сброс
            }
        }

        function drawGrid() {
            ctx.strokeStyle = '#dcdde1';
            ctx.lineWidth = 0.5;
            const step = 50;
            for (let x = 0; x < canvas.width; x += step) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += step) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        // Отмена последней точки
        function undoPoint() {
            if (points.length > 0 && !closed) {
                points.pop();
                draw();
            }
        }

        // Замыкание контура
        function closePolygon() {
            if (points.length < 3) {
                alert('Нужно минимум 3 точки, чтобы замкнуть фигуру.');
                return;
            }
            closed = true;
            calculateOffset();
            draw();
        }

        // Полная очистка
        function clearAll() {
            points = [];
            offsetPoints = [];
            closed = false;
            document.getElementById('results').innerHTML = '<div class="result-item"><span class="result-label">Нарисуйте форму стекла</span></div>';
            draw();
        }

        // Вспомогательные функции для геометрии
        function getNormal(p1, p2) {
            // Нормаль к отрезку (p1->p2), направленная "внутрь" (предполагаем обход по часовой стрелке)
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const len = Math.hypot(dx, dy);
            return { x: -dy / len, y: dx / len }; // Для обхода по часовой стрелке нормаль внутрь
        }

        function calculateOffset() {
            if (points.length < 3) return;
            
            // Определяем направление обхода (по часовой или против) для правильной ориентации нормалей
            let area = 0;
            for (let i = 0; i < points.length; i++) {
                const j = (i + 1) % points.length;
                area += points[i].x * points[j].y - points[j].x * points[i].y;
            }
            const isClockwise = area < 0; // Если площадь отрицательная, обход по часовой

            offsetPoints = [];
            for (let i = 0; i < points.length; i++) {
                const prev = points[(i - 1 + points.length) % points.length];
                const curr = points[i];
                const next = points[(i + 1) % points.length];

                // Векторы сторон
                const v1 = { x: curr.x - prev.x, y: curr.y - prev.y };
                const v2 = { x: next.x - curr.x, y: next.y - curr.y };

                // Нормали (внутрь)
                let n1 = { x: -v1.y, y: v1.x };
                let n2 = { x: -v2.y, y: v2.x };
                
                if (!isClockwise) {
                    // Если обход против часовой, инвертируем нормали
                    n1 = { x: v1.y, y: -v1.x };
                    n2 = { x: v2.y, y: -v2.x };
                }

                // Нормируем
                const len1 = Math.hypot(n1.x, n1.y);
                const len2 = Math.hypot(n2.x, n2.y);
                n1 = { x: n1.x / len1, y: n1.y / len1 };
                n2 = { x: n2.x / len2, y: n2.y / len2 };

                // Биссектриса
                let bis = { x: n1.x + n2.x, y: n1.y + n2.y };
                const bisLen = Math.hypot(bis.x, bis.y);
                if (bisLen === 0) {
                    // Если векторы противоположны (развернутый угол), берем одну из нормалей
                    bis = n1;
                } else {
                    bis = { x: bis.x / bisLen, y: bis.y / bisLen };
                }

                // Длина смещения вдоль биссектрисы: l = d / cos(θ/2)
                // cos(θ/2) = sqrt((1 + dot(n1,n2)) / 2)
                const dot = n1.x * n2.x + n1.y * n2.y;
                const cosHalf = Math.sqrt(Math.max(0, (1 + dot) / 2));
                let l = offsetMM / cosHalf;
                if (cosHalf < 0.01) l = offsetMM; // Защита от деления на ноль

                // Смещаем вершину
                offsetPoints.push({
                    x: curr.x + bis.x * l,
                    y: curr.y + bis.y * l
                });
            }
        }

        // Расчет и вывод результатов
        function calculate() {
            if (!closed || offsetPoints.length === 0) {
                alert('Сначала нарисуйте и замкните форму стекла.');
                return;
            }

            // Вычисляем длины сторон рамки (в пикселях, переводим в мм)
            let resultsHTML = '<h3 style="margin-top:0; text-align:center; color:#2c3e50;">Стороны рамки</h3>';
            let totalLength = 0;
            for (let i = 0; i < offsetPoints.length; i++) {
                const p1 = offsetPoints[i];
                const p2 = offsetPoints[(i + 1) % offsetPoints.length];
                const distPx = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                const distMM = Math.round(distPx / pxPerMM); // Пересчет в мм
                totalLength += distMM;
                resultsHTML += `<div class="result-item">
                    <span class="result-label">Сторона ${i + 1}:</span>
                    <span class="result-value">${distMM} мм</span>
                </div>`;
            }
            // Добавляем общую длину (полезно для расчета расхода материала)
            resultsHTML += `<div class="result-item" style="background:#d1f2eb; margin-top:5px;">
                <span class="result-label">Общий периметр:</span>
                <span class="result-value">${Math.round(totalLength)} мм</span>
            </div>`;

            document.getElementById('results').innerHTML = resultsHTML;
        }

        // Запуск
        resizeCanvas();
    </script>
</body>
</html>

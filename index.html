<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Расчет рамки по форме</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 1.3em; text-align: center; color: #2c3e50; margin-top: 0; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.95em; color: #34495e; }
        select, input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #bdc3c7; border-radius: 8px; font-size: 1em; background-color: #fff; }
        select:focus, input:focus { outline: none; border-color: #3498db; }
        
        .inputs-container { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #e9ecef; }
        
        .btn-calc { width: 100%; padding: 15px; background-color: #27ae60; color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-calc:active { background-color: #219150; }
        
        .results { margin-top: 20px; background: #e8f6f3; border-radius: 10px; padding: 15px; display: none; }
        .results h3 { margin-top: 0; text-align: center; color: #2c3e50; margin-bottom: 15px; }
        
        .result-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 5px; padding: 10px 0; border-bottom: 1px solid #d1f2eb; font-size: 0.9em; align-items: center; }
        .result-row:last-child { border-bottom: none; }
        .result-header { font-weight: bold; color: #34495e; border-bottom: 2px solid #bdc3c7; padding-bottom: 5px; }
        
        .val-glass { color: #7f8c8d; }
        .val-frame { font-weight: bold; color: #e74c3c; }
        .val-saw { font-weight: bold; color: #2980b9; font-size: 1.1em; }
        
        .hint { font-size: 0.8em; color: #7f8c8d; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📐 Калькулятор рамки</h1>
        
        <div class="form-group">
            <label>Выберите форму стекла:</label>
            <select id="shapeType" onchange="updateInputs()">
                <option value="trapezoid_iso">Трапеция (равнобедренная)</option>
                <option value="trapezoid_right">Трапеция (прямоугольная)</option>
                <option value="triangle">Треугольник (по 3 сторонам)</option>
            </select>
        </div>

        <div class="inputs-container" id="inputsContainer">
            <!-- Поля ввода будут добавляться сюда через JS -->
        </div>

        <button class="btn-calc" onclick="calculate()">Рассчитать размеры</button>

        <div class="results" id="results">
            <h3>Результаты</h3>
            <div class="result-row result-header">
                <div>Сторона</div>
                <div>Стекло</div>
                <div>Рамка</div>
                <div>Пила</div>
            </div>
            <div id="resultsList"></div>
            <p class="hint">* Пила: это значение нужно выставить на станке (Рамка + 22мм).</p>
        </div>
    </div>

    <script>
        const OFFSET = 11; // Смещение внутрь с каждой стороны в мм
        const SAW_OFFSET = 22; // Пила отнимает 22мм автоматически

        // Обновление полей ввода при смене формы
        function updateInputs() {
            const shape = document.getElementById('shapeType').value;
            const container = document.getElementById('inputsContainer');
            container.innerHTML = '';

            if (shape === 'trapezoid_iso') {
                container.innerHTML = `
                    <div class="form-group"><label>Нижнее основание стекла (мм)</label><input type="number" id="base1" value="500"></div>
                    <div class="form-group"><label>Верхнее основание стекла (мм)</label><input type="number" id="base2" value="300"></div>
                    <div class="form-group"><label>Боковая сторона стекла (мм)</label><input type="number" id="leg" value="200"></div>
                `;
            } else if (shape === 'trapezoid_right') {
                container.innerHTML = `
                    <div class="form-group"><label>Нижнее основание стекла (мм)</label><input type="number" id="base1" value="500"></div>
                    <div class="form-group"><label>Верхнее основание стекла (мм)</label><input type="number" id="base2" value="300"></div>
                    <div class="form-group"><label>Высота (прямая сторона) (мм)</label><input type="number" id="height" value="200"></div>
                `;
            } else if (shape === 'triangle') {
                container.innerHTML = `
                    <div class="form-group"><label>Сторона 1 (мм)</label><input type="number" id="t_side1" value="400"></div>
                    <div class="form-group"><label>Сторона 2 (мм)</label><input type="number" id="t_side2" value="400"></div>
                    <div class="form-group"><label>Сторона 3 (мм)</label><input type="number" id="t_side3" value="400"></div>
                `;
            }
            document.getElementById('results').style.display = 'none';
        }

        // Вспомогательная функция: котангенс угла (угол в радианах)
        function cot(angle) {
            return 1 / Math.tan(angle);
        }

        // Основная функция расчета
        function calculate() {
            const shape = document.getElementById('shapeType').value;
            let sides = []; // Длины сторон стекла
            let angles = []; // Внутренние углы в радианах
            let sideNames = [];

            if (shape === 'trapezoid_iso') {
                const a = parseFloat(document.getElementById('base1').value);
                const b = parseFloat(document.getElementById('base2').value);
                const c = parseFloat(document.getElementById('leg').value);
                
                // Проверка на валидность (сторона не может быть меньше разницы оснований)
                if (c <= Math.abs(a - b) / 2) {
                    alert('Ошибка: Боковая сторона слишком короткая для таких оснований.');
                    return;
                }

                // Вычисление углов
                const cosAlpha = (a - b) / (2 * c);
                const alpha = Math.acos(cosAlpha); // Угол при нижнем основании
                const beta = Math.PI - alpha;      // Угол при верхнем основании

                sides = [a, c, b, c];
                angles = [alpha, beta, beta, alpha]; // Углы для сторон: нижняя, правая, верхняя, левая
                sideNames = ['Нижнее осн.', 'Боковая', 'Верхнее осн.', 'Боковая'];

            } else if (shape === 'trapezoid_right') {
                const a = parseFloat(document.getElementById('base1').value); // Нижнее
                const b = parseFloat(document.getElementById('base2').value); // Верхнее
                const h = parseFloat(document.getElementById('height').value); // Высота (прямая сторона)
                
                if (a < b) {
                    alert('Ошибка: В прямоугольной трапеции нижнее основание должно быть больше верхнего.');
                    return;
                }

                const L = Math.sqrt(h*h + (a-b)*(a-b)); // Длина наклонной стороны
                
                const alpha = Math.PI / 2; // Прямые углы
                const gamma = Math.atan2(h, a - b); // Угол наклона
                const delta = Math.PI - gamma; // Тупой угол

                // Обход по часовой стрелке: нижнее, наклонное, верхнее, прямое
                sides = [a, L, b, h];
                angles = [alpha, gamma, delta, alpha];
                sideNames = ['Нижнее осн.', 'Наклонная', 'Верхнее осн.', 'Высота'];

            } else if (shape === 'triangle') {
                const s1 = parseFloat(document.getElementById('t_side1').value);
                const s2 = parseFloat(document.getElementById('t_side2').value);
                const s3 = parseFloat(document.getElementById('t_side3').value);

                // Проверка неравенства треугольника
                if (s1 + s2 <= s3 || s1 + s3 <= s2 || s2 + s3 <= s1) {
                    alert('Ошибка: Такого треугольника не существует (сумма двух сторон должна быть больше третьей).');
                    return;
                }

                // Теорема косинусов
                const A = Math.acos((s2*s2 + s3*s3 - s1*s1) / (2*s2*s3));
                const B = Math.acos((s1*s1 + s3*s3 - s2*s2) / (2*s1*s3));
                const C = Math.PI - A - B;

                sides = [s1, s2, s3];
                angles = [A, B, C]; // Углы, противолежащие сторонам 1, 2, 3
                sideNames = ['Сторона 1', 'Сторона 2', 'Сторона 3'];
            }

            // Расчет длин сторон рамки
            let resultsHTML = '';
            const n = sides.length;

            for (let i = 0; i < n; i++) {
                const glassLen = sides[i];
                const angle1 = angles[i];
                const angle2 = angles[(i + 1) % n]; // Следующий угол (замыкаем круг)

                // Формула смещения: L_рамки = L_стекла - d * (ctg(a/2) + ctg(b/2))
                const reduction = OFFSET * (cot(angle1 / 2) + cot(angle2 / 2));
                let frameLen = glassLen - reduction;

                // Если рамка получилась слишком короткой (или отрицательной)
                if (frameLen < 0) frameLen = 0;

                // Установка для пилы (Рамка + 22мм, так как пила отнимает 22мм)
                const sawSetting = frameLen + SAW_OFFSET;

                resultsHTML += `
                    <div class="result-row">
                        <div>${sideNames[i]}</div>
                        <div class="val-glass">${Math.round(glassLen)}</div>
                        <div class="val-frame">${Math.round(frameLen)}</div>
                        <div class="val-saw">${Math.round(sawSetting)}</div>
                    </div>
                `;
            }

            document.getElementById('resultsList').innerHTML = resultsHTML;
            document.getElementById('results').style.display = 'block';
        }

        // Инициализация при загрузке
        updateInputs();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор внутреннего контура (отступ 11 мм)</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        textarea { width: 100%; height: 120px; font-family: monospace; font-size: 14px; }
        button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        .result { margin-top: 1.5rem; padding: 1rem; background: #f8f9fa; border-radius: 6px; border: 1px solid #dee2e6; white-space: pre-wrap; font-family: monospace; }
        .error { color: #dc3545; background: #f8d7da; border-color: #f5c6cb; }
        h2 { margin-top: 1.5rem; font-size: 1.2rem; }
        .hint { color: #6c757d; font-size: 0.9rem; }
    </style>
</head>
<body>

    <h1>Калькулятор внутреннего контура</h1>
    <p class="hint">
        Введите координаты вершин фигуры <strong>по часовой стрелке</strong> (или против — библиотека сама определит направление).<br>
        Каждая вершина — это пара <code>x, y</code> в миллиметрах. Можно вводить по одной паре в строке или всё в одной строке через пробел/запятую.
    </p>

    <label for="verticesInput"><strong>Координаты вершин (x, y):</strong></label><br>
    <textarea id="verticesInput" placeholder="Пример для трапеции:
0, 0
660, 0
721, 850
0, 1140"></textarea>

    <div style="margin-top: 1rem;">
        <label for="offsetInput"><strong>Отступ внутрь (мм):</strong></label>
        <input type="number" id="offsetInput" value="11" min="0" step="0.1" style="width: 100px; padding: 0.4rem;">
        <button id="calculateBtn">Рассчитать</button>
    </div>

    <div id="result" class="result" style="display: none;"></div>

    <script type="module">
        import { inflatePaths, JoinType, EndType } from 'https://cdn.jsdelivr.net/npm/clipper2-ts@2.0.1-19/dist/clipper2-ts.esm.js';

        const verticesInput = document.getElementById('verticesInput');
        const offsetInput = document.getElementById('offsetInput');
        const calculateBtn = document.getElementById('calculateBtn');
        const resultDiv = document.getElementById('result');

        function parseVertices(text) {
            // Убираем пустые строки и лишние пробелы
            const lines = text.trim().split(/[\n;]+/).filter(line => line.trim() !== '');
            const points = [];
            for (const line of lines) {
                // Разделяем по запятой или пробелу
                const parts = line.split(/[,\s]+/).filter(p => p !== '');
                if (parts.length < 2) {
                    throw new Error(`Не удалось распознать строку: "${line}". Ожидается "x, y".`);
                }
                const x = parseFloat(parts[0]);
                const y = parseFloat(parts[1]);
                if (isNaN(x) || isNaN(y)) {
                    throw new Error(`Некорректные числа в строке: "${line}"`);
                }
                points.push({ x, y });
            }
            if (points.length < 3) {
                throw new Error('Нужно минимум 3 вершины.');
            }
            return points;
        }

        function formatPoint(p) {
            return `(${p.x.toFixed(1)}, ${p.y.toFixed(1)})`;
        }

        function calculate() {
            resultDiv.style.display = 'none';
            resultDiv.classList.remove('error');

            try {
                const points = parseVertices(verticesInput.value);
                const offsetDistance = parseFloat(offsetInput.value);

                if (isNaN(offsetDistance) || offsetDistance < 0) {
                    throw new Error('Отступ должен быть неотрицательным числом.');
                }

                // Clipper2 ожидает массив путей. У нас один полигон.
                const subject = [points];

                // Выполняем смещение внутрь. Отрицательное значение = внутрь.
                // JoinType.Miter обычно даёт наиболее точные углы, как при резке.
                const offsetPaths = inflatePaths(subject, -offsetDistance, JoinType.Miter, EndType.Polygon);

                if (!offsetPaths || offsetPaths.length === 0) {
                    throw new Error('Внутренний контур не может быть построен. Возможно, отступ слишком велик для данной фигуры.');
                }

                // Берём первый (и единственный) контур.
                const innerPoints = offsetPaths[0];

                // Вычисляем длины сторон внутреннего контура.
                const sideLengths = [];
                for (let i = 0; i < innerPoints.length; i++) {
                    const p1 = innerPoints[i];
                    const p2 = innerPoints[(i + 1) % innerPoints.length]; // замыкаем
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const length = Math.sqrt(dx * dx + dy * dy);
                    sideLengths.push({
                        from: formatPoint(p1),
                        to: formatPoint(p2),
                        length: length
                    });
                }

                // Формируем отчёт.
                let report = `Исходных вершин: ${points.length}\n`;
                report += `Отступ внутрь: ${offsetDistance} мм\n`;
                report += `Внутренний контур (${innerPoints.length} вершин):\n\n`;
                innerPoints.forEach((p, idx) => {
                    report += `  V${idx + 1}: ${formatPoint(p)}\n`;
                });
                report += `\nДлины сторон внутреннего контура (мм):\n`;
                sideLengths.forEach((side, idx) => {
                    report += `  Сторона ${idx + 1}: ${side.from} → ${side.to} = ${side.length.toFixed(1)} мм\n`;
                });

                resultDiv.textContent = report;
                resultDiv.style.display = 'block';

            } catch (err) {
                resultDiv.textContent = 'Ошибка: ' + err.message;
                resultDiv.classList.add('error');
                resultDiv.style.display = 'block';
            }
        }

        calculateBtn.addEventListener('click', calculate);

        // Пример по умолчанию (трапеция из вашего сообщения)
        verticesInput.value = `0, 0
660, 0
721, 850
0, 1140`;
    </script>
</body>
</html>
